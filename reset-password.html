<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Digital Card Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:#101010;color:#f5f5f5;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
    .card{width:100%;max-width:440px;background:#1c1c1c;border:1px solid #40351f;border-radius:16px;padding:26px;box-shadow:0 12px 40px #0006}
    h1{margin:0 0 10px;color:#d5ad55;font-size:25px}
    p{color:#ccc;line-height:1.5}
    label{display:block;color:#d5ad55;margin:18px 0 7px;font-size:14px}
    input{width:100%;padding:13px;border:1px solid #555;border-radius:8px;background:#292929;color:white;font-size:16px}
    button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:8px;background:#d5ad55;color:#111;font-weight:bold;font-size:15px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{margin-top:16px;line-height:1.5;white-space:pre-wrap}
    .hint{font-size:12px;color:#aaa}
    a{color:#e6c477}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <h1>✦ Nouveau mot de passe</h1>
    <p>Choisissez un nouveau mot de passe pour accéder à l’administration de Digital Card Studio.</p>

    <section id="formArea" hidden>
      <form id="resetForm">
        <label for="password">Nouveau mot de passe</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Minimum 8 caractères">

        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Retapez le mot de passe">

        <button id="saveButton" type="submit">Enregistrer le nouveau mot de passe</button>
      </form>
    </section>

    <p id="status">Vérification du lien de récupération...</p>
    <p class="hint">Si le lien a expiré ou a déjà été utilisé, retournez dans Supabase et envoyez un nouvel e-mail de récupération.</p>
  </main>

<script>
const SUPABASE_URL = "https://qgrrgvqeveqcusvzaump.supabase.co";
const SUPABASE_KEY = "sb_publishable_MZaIjhV4gLUkOV4E9iZb0w_Y12deY0J";
const ADMIN_URL = "https://hamzamaalel2-hash.github.io/card_studio_digital/admin.html";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

const statusEl = document.getElementById("status");
const formArea = document.getElementById("formArea");
const form = document.getElementById("resetForm");
const saveButton = document.getElementById("saveButton");

let ready = false;
let verifying = false;

function showReady() {
  ready = true;
  formArea.hidden = false;
  statusEl.textContent = "Lien vérifié. Entrez votre nouveau mot de passe.";
}

async function verifyRecoveryLink() {
  if (verifying) return;
  verifying = true;

  try {
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get("token_hash");
    const type = params.get("type");

    // Supporte les liens Supabase utilisant token_hash dans l'URL.
    if (tokenHash && type === "recovery") {
      const { error } = await db.auth.verifyOtp({
        token_hash: tokenHash,
        type: "recovery"
      });
      if (error) throw error;
      showReady();
      return;
    }

    // Supporte les liens Supabase classiques contenant access_token/refresh_token dans le hash.
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    if (data.session) {
      showReady();
      return;
    }

    statusEl.textContent = "Lien invalide ou expiré. Demandez un nouvel e-mail de récupération depuis Supabase.";
  } catch (error) {
    statusEl.textContent = "Impossible de vérifier le lien : " + (error.message || "erreur inconnue");
  } finally {
    verifying = false;
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    showReady();
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!ready) return;

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    statusEl.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
    return;
  }
  if (password !== confirmPassword) {
    statusEl.textContent = "Les deux mots de passe ne correspondent pas.";
    return;
  }

  saveButton.disabled = true;
  statusEl.textContent = "Enregistrement du nouveau mot de passe...";

  const { error } = await db.auth.updateUser({ password });

  if (error) {
    statusEl.textContent = "Erreur : " + error.message;
    saveButton.disabled = false;
    return;
  }

  statusEl.textContent = "Mot de passe modifié avec succès. Redirection vers l’administration...";
  setTimeout(() => {
    window.location.replace(ADMIN_URL);
  }, 1800);
});

verifyRecoveryLink();
</script>
</body>
</html>
