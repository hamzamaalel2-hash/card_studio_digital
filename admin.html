
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Card Studio - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#f5f5f5;font-family:Arial,sans-serif;padding:20px}
.container{max-width:950px;margin:auto}
h1,h2{color:#d5ad55}
.card{background:#1c1c1c;border:1px solid #40351f;border-radius:14px;padding:20px;margin:18px 0}
input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #555;border-radius:8px;background:#292929;color:white}
input[type=checkbox],input[type=file]{width:auto}
input[type=color]{height:48px;padding:4px;cursor:pointer}
label{color:#d5ad55;font-size:14px}
button{padding:11px 16px;border:0;border-radius:8px;background:#d5ad55;color:#111;font-weight:bold;cursor:pointer;margin:5px 3px}
button.danger{background:#a83232;color:white}
button.secondary{background:#444;color:white}
.client{border-bottom:1px solid #444;padding:15px 0}
.client strong{color:#d5ad55}
small{color:#bbb}
#status{margin:12px 0;color:#d5ad55;white-space:pre-wrap}
#app{display:none}
#qrModal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:20px}
#qrBox{background:white;color:#111;padding:25px;border-radius:12px;text-align:center;max-width:340px;width:100%}
#qrcode{display:flex;justify-content:center;margin:15px}
#qrcode img{max-width:100%}
.color-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.color-item{background:#292929;border:1px solid #444;border-radius:10px;padding:12px}
.color-item label{display:block;margin-bottom:5px}
.color-item input{margin:5px 0 0;width:100%}
.color-heading{margin-top:25px}
.color-note{color:#aaa;font-size:12px;line-height:1.5}
</style>
</head>

<body>
<div class="container">

<h1>✦ DIGITAL CARD STUDIO</h1>

<div id="login" class="card">
<h2>Connexion Admin</h2>
<label>Email</label>
<input id="loginEmail" type="email" placeholder="Votre email">

<label>Mot de passe</label>
<input id="loginPassword" type="password" placeholder="Votre mot de passe">

<button onclick="loginAdmin()">Se connecter</button>
<div id="loginStatus"></div>
</div>

<div id="app">

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
<h2>Gestion des cartes</h2>
<button class="secondary" onclick="logoutAdmin()">Déconnexion</button>
</div>
<button onclick="newCard()">+ Ajouter un client</button>
</div>

<div class="card">

<h2 id="formTitle">Nouvelle carte</h2>
<input type="hidden" id="client_id">

<label>Nom complet *</label>
<input id="full_name" placeholder="Nom du client">

<label>Nom du commerce</label>
<input id="business_name" placeholder="Nom de l'entreprise">

<label>Fonction</label>
<input id="job_title" placeholder="Ex: Gérant">

<label>Lien personnalisé (slug) *</label>
<input id="slug" placeholder="ex: hamza">

<label>Photo depuis votre ordinateur</label>
<input id="photo_file" type="file" accept="image/*">
<small>Image JPG, PNG ou WEBP — maximum 5 Mo.</small>

<label>Photo URL (optionnel)</label>
<input id="photo_url" placeholder="Lien de la photo">

<label>Téléphone</label>
<input id="phone" placeholder="+216 ...">

<label>WhatsApp</label>
<input id="whatsapp" placeholder="+216 ...">

<label>Instagram</label>
<input id="instagram" placeholder="https://instagram.com/...">

<label>Facebook</label>
<input id="facebook" placeholder="https://facebook.com/...">

<label>TikTok</label>
<input id="tiktok" placeholder="https://tiktok.com/@...">

<label>Google Maps</label>
<input id="maps_url" placeholder="Lien Google Maps">

<label>Google Review</label>
<input id="review_url" placeholder="Lien Google Review">

<label>Email</label>
<input id="email" type="email" placeholder="email@example.com">

<label>Site web</label>
<input id="website" placeholder="https://...">

<div class="color-heading">
<h2>🎨 Personnalisation des couleurs</h2>
<p class="color-note">Choisissez les couleurs de cette carte. Chaque client peut avoir son propre design.</p>
</div>

<div class="color-grid">

<div class="color-item">
<label>1. Couleur de l'arrière-plan</label>
<input type="color" id="background_color" value="#050505">
</div>

<div class="color-item">
<label>2. Couleur de la carte</label>
<input type="color" id="card_color" value="#101010">
</div>

<div class="color-item">
<label>3. Couleur du cadre</label>
<input type="color" id="border_color" value="#D4AF37">
</div>

<div class="color-item">
<label>4. Couleur des boutons</label>
<input type="color" id="button_color" value="#202020">
</div>

<div class="color-item">
<label>5. Couleur du texte</label>
<input type="color" id="text_color" value="#FFFFFF">
</div>

<div class="color-item">
<label>6. Couleur des titres</label>
<input type="color" id="title_color" value="#F1D477">
</div>

<div class="color-item">
<label>7. Couleur des détails et icônes</label>
<input type="color" id="accent_color" value="#D4AF37">
</div>

<div class="color-item">
<label>8. Couleur du texte des boutons</label>
<input type="color" id="button_text_color" value="#E9CD75">
</div>

</div>

<button class="secondary" onclick="resetColors()">↺ Couleurs par défaut</button>

<label style="display:block;margin:20px 0 10px">
<input id="is_published" type="checkbox" checked>
 Publier la carte
</label>

<button onclick="saveClient()">Enregistrer la carte</button>
<button class="secondary" onclick="newCard()">Nouveau</button>

<div id="status"></div>
</div>

<div class="card">
<h2>Mes clients</h2>
<div id="clientsList">Chargement...</div>
</div>

</div>
</div>

<div id="qrModal">
<div id="qrBox">
<h2>QR CODE</h2>
<div id="qrcode"></div>
<p id="qrLink" style="font-size:12px;word-break:break-all"></p>
<button onclick="downloadQR()">Télécharger PNG</button>
<button class="secondary" onclick="closeQR()">Fermer</button>
</div>
</div>

<script>
const SUPABASE_URL="https://qgrrgvqeveqcusvzaump.supabase.co";
const SUPABASE_KEY="sb_publishable_MZaIjhV4gLUkOV4E9iZb0w_Y12deY0J";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const fields=[
"full_name","business_name","job_title","slug","photo_url",
"phone","whatsapp","instagram","facebook","tiktok",
"maps_url","review_url","email","website"
];

const defaultColors={
background_color:"#050505",
card_color:"#101010",
border_color:"#D4AF37",
button_color:"#202020",
text_color:"#FFFFFF",
title_color:"#F1D477",
accent_color:"#D4AF37",
button_text_color:"#E9CD75"
};

const colorFields=Object.keys(defaultColors);

let currentQR="";

function el(id){
  return document.getElementById(id);
}

function setStatus(message){
  el("status").textContent=message;
}

function resetColors(){
  colorFields.forEach(field=>{
    el(field).value=defaultColors[field];
  });
}

async function loginAdmin(){
  el("loginStatus").textContent="Connexion...";

  const email=el("loginEmail").value.trim();
  const password=el("loginPassword").value;

  const {data,error}=await db.auth.signInWithPassword({email,password});

  if(error){
    el("loginStatus").textContent="Erreur : "+error.message;
    return;
  }

  await showApp();
}

async function logoutAdmin(){
  await db.auth.signOut();
  el("app").style.display="none";
  el("login").style.display="block";
}

async function showApp(){
  el("login").style.display="none";
  el("app").style.display="block";
  await loadClients();
}

function newCard(){
  el("client_id").value="";

  fields.forEach(f=>{
    el(f).value="";
  });

  el("photo_file").value="";
  el("is_published").checked=true;
  el("formTitle").textContent="Nouvelle carte";

  resetColors();
  setStatus("");

  window.scrollTo({top:0,behavior:"smooth"});
}

async function uploadPhoto(file,slug){
  if(!file)return null;

  if(!file.type.startsWith("image/")){
    throw new Error("Veuillez choisir une image.");
  }

  if(file.size>5*1024*1024){
    throw new Error("La photo ne doit pas dépasser 5 Mo.");
  }

  const extension=(file.name.split(".").pop()||"jpg")
    .toLowerCase().replace(/[^a-z0-9]/g,"");

  const safeSlug=(slug||"client").toLowerCase()
    .replace(/[^a-z0-9-]/g,"-");

  const path=safeSlug+"/"+Date.now()+"-"+
    Math.random().toString(36).slice(2)+"."+extension;

  const {error}=await db.storage.from("client-photos").upload(
    path,file,{
      contentType:file.type,
      cacheControl:"3600",
      upsert:false
    }
  );

  if(error)throw error;

  const {data}=db.storage.from("client-photos").getPublicUrl(path);

  return data.publicUrl;
}

async function saveClient(){
  try{
    setStatus("Enregistrement en cours...");

    const id=el("client_id").value;
    const slug=el("slug").value.trim();

    if(!el("full_name").value.trim()||!slug){
      setStatus("Veuillez remplir le nom et le lien personnalisé.");
      return;
    }

    const record={};

    fields.forEach(f=>{
      record[f]=el(f).value.trim();
    });

    colorFields.forEach(f=>{
      record[f]=el(f).value || defaultColors[f];
    });

    record.slug=slug;
    record.is_published=el("is_published").checked;

    const file=el("photo_file").files[0];

    if(file){
      setStatus("Téléchargement de la photo...");
      record.photo_url=await uploadPhoto(file,slug);
      el("photo_url").value=record.photo_url;
    }

    setStatus("Sauvegarde de la carte...");

    let result;

    if(id){
      result=await db.from("clients").update(record).eq("id",id);
    }else{
      result=await db.from("clients").insert([record]);
    }

    if(result.error)throw result.error;

    setStatus("Carte enregistrée avec succès !");

    newCard();
    await loadClients();

  }catch(error){
    setStatus("Erreur : "+error.message);
  }
}

async function loadClients(){
  el("clientsList").textContent="Chargement...";

  const {data,error}=await db.from("clients")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    el("clientsList").textContent="Erreur : "+error.message;
    return;
  }

  if(!data||data.length===0){
    el("clientsList").textContent="Aucun client pour le moment.";
    return;
  }

  el("clientsList").innerHTML="";

  data.forEach(client=>{
    const url=window.location.origin+
      window.location.pathname.replace("admin.html","")+
      "?id="+encodeURIComponent(client.slug);

    const div=document.createElement("div");
    div.className="client";

    const title=document.createElement("strong");
    title.textContent=client.full_name||"Sans nom";

    const details=document.createElement("div");
    const small=document.createElement("small");

    small.textContent=" — "+(client.business_name||"")+
      " | "+(client.is_published?"Publié":"Non publié");

    details.appendChild(small);

    const link=document.createElement("p");
    const anchor=document.createElement("a");
    anchor.href=url;
    anchor.target="_blank";
    anchor.textContent="Ouvrir la carte";
    anchor.style.color="#d5ad55";
    link.appendChild(anchor);

    const edit=document.createElement("button");
    edit.textContent="Modifier";
    edit.onclick=()=>editClient(client);

    const qr=document.createElement("button");
    qr.textContent="QR Code";
    qr.onclick=()=>showQR(url);

    const del=document.createElement("button");
    del.textContent="Supprimer";
    del.className="danger";
    del.onclick=()=>deleteClient(client.id);

    div.append(title,details,link,edit,qr,del);
    el("clientsList").appendChild(div);
  });
}

/* FIX : recharger la fiche directement depuis Supabase */
async function editClient(client){
  setStatus("Chargement des données du client...");

  const {data,error}=await db
    .from("clients")
    .select("*")
    .eq("id",client.id)
    .single();

  if(error){
    setStatus("Erreur : "+error.message);
    return;
  }

  el("client_id").value=data.id;

  fields.forEach(f=>{
    el(f).value=data[f]??"";
  });

  colorFields.forEach(f=>{
    const value=data[f];

    el(f).value=(
      typeof value==="string" &&
      /^#[0-9a-fA-F]{6}$/.test(value)
    )?value:defaultColors[f];
  });

  el("photo_file").value="";
  el("is_published").checked=!!data.is_published;

  el("formTitle").textContent="Modifier la carte";

  setStatus("Vous modifiez : "+data.full_name);

  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteClient(id){
  if(!confirm("Voulez-vous vraiment supprimer cette carte ?"))return;

  const {error}=await db.from("clients").delete().eq("id",id);

  if(error){
    alert("Erreur : "+error.message);
    return;
  }

  alert("Carte supprimée.");
  await loadClients();
}

function showQR(url){
  currentQR=url;
  el("qrcode").innerHTML="";
  el("qrLink").textContent=url;

  new QRCode(el("qrcode"),{
    text:url,
    width:220,
    height:220,
    correctLevel:QRCode.CorrectLevel.H
  });

  el("qrModal").style.display="flex";
}

function downloadQR(){
  const img=el("qrcode").querySelector("img");
  const canvas=el("qrcode").querySelector("canvas");

  let dataUrl="";

  if(img&&img.src){
    dataUrl=img.src;
  }else if(canvas){
    dataUrl=canvas.toDataURL("image/png");
  }

  if(!dataUrl){
    alert("QR Code non disponible.");
    return;
  }

  const a=document.createElement("a");
  a.href=dataUrl;
  a.download="QR-Code.png";
  a.click();
}

function closeQR(){
  el("qrModal").style.display="none";
}

db.auth.getSession().then(({data,error})=>{
  if(error){
    el("loginStatus").textContent=error.message;
    return;
  }

  if(data.session){
    showApp();
  }
});
</script>

</body>
</html>
