
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Digital Card</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:25px 14px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}

.card{
  width:100%;
  max-width:430px;
  padding:18px;
  background:linear-gradient(145deg,#202020,#090909);
  border:1px solid #c5a04b;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 35px #c5a04b25;
  overflow:hidden;
}

.logo{
  display:block;
  width:calc(100% + 36px);
  height:270px;
  margin:-18px -18px 22px;
  object-fit:cover;
  object-position:center;
  border:0;
  border-bottom:2px solid #d5b15c;
  border-radius:24px 24px 12px 12px;
}

.logo.hidden{display:none}

h1{
  color:#dfbd6a;
  font-size:27px;
  margin:8px 0;
}

.business{
  color:#d5b15c;
  font-size:18px;
  margin:5px 0;
}

.job{
  color:#aaa;
  font-size:14px;
  margin:7px 0 22px;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.buttons a{
  display:block;
  padding:15px;
  border:1px solid #c5a04b;
  border-radius:12px;
  color:#e2c16d;
  text-decoration:none;
  font-weight:bold;
  background:#151515;
  transition:.2s;
}

.buttons a:hover{
  background:#c5a04b;
  color:#111;
}

.buttons a.primary{
  background:#c5a04b;
  color:#111;
}

.footer{
  display:block;
  margin-top:22px;
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

.message{
  color:#d5b15c;
  text-align:center;
  padding:30px 10px;
}
</style>
</head>

<body>

<div class="card" id="card" style="display:none">

  <img class="logo hidden" id="photo" alt="Photo du client">

  <h1 id="name"></h1>
  <div class="business" id="business"></div>
  <div class="job" id="job"></div>

  <div class="buttons" id="buttons"></div>

  <small class="footer">DIGITAL BUSINESS CARD</small>

</div>

<div class="message" id="message">Chargement de votre carte...</div>

<script>
const SUPABASE_URL = "https://qgrrgvqeveqcusvzaump.supabase.co";

const SUPABASE_KEY = "sb_publishable_MZaIjhV4gLUkOV4E9iZb0w_Y12deY0J";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);
const slug = params.get("id");

function addButton(label,url,primary=false){
  if(!url || !url.trim()) return;

  const a = document.createElement("a");
  a.textContent = label;
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";

  if(primary) a.className = "primary";

  document.getElementById("buttons").appendChild(a);
}

function cleanPhone(value){
  return (value || "").replace(/[^\d+]/g,"");
}

function showCard(c){

  document.getElementById("name").textContent =
    c.full_name || "";

  document.getElementById("business").textContent =
    c.business_name || "";

  document.getElementById("job").textContent =
    c.job_title || "";

  const photo = document.getElementById("photo");

  if(c.photo_url){
    photo.src = c.photo_url;
    photo.classList.remove("hidden");
  }

  const buttons = document.getElementById("buttons");

  buttons.innerHTML = "";

  if(c.phone){
    addButton(
      "☎ Téléphone",
      "tel:" + cleanPhone(c.phone),
      true
    );
  }

  if(c.whatsapp){
    addButton(
      "WhatsApp",
      "https://wa.me/" + cleanPhone(c.whatsapp).replace("+","")
    );
  }

  if(c.instagram){
    addButton("Instagram",c.instagram);
  }

  if(c.facebook){
    addButton("Facebook",c.facebook);
  }

  if(c.tiktok){
    addButton("TikTok",c.tiktok);
  }

  if(c.maps_url){
    addButton("Localisation",c.maps_url);
  }

  if(c.review_url){
    addButton("Google Reviews",c.review_url);
  }

  if(c.email){
    addButton(
      "Email",
      "mailto:" + c.email
    );
  }

  if(c.website){
    let website = c.website;

    if(!/^https?:\/\//i.test(website)){
      website = "https://" + website;
    }

    addButton("Site Web",website);
  }

  const vcard =
    "BEGIN:VCARD\n" +
    "VERSION:3.0\n" +
    "FN:" + (c.full_name || "") + "\n" +
    "ORG:" + (c.business_name || "") + "\n" +
    "TITLE:" + (c.job_title || "") + "\n" +
    "TEL:" + (c.phone || "") + "\n" +
    "EMAIL:" + (c.email || "") + "\n" +
    "URL:" + (c.website || "") + "\n" +
    "END:VCARD";

  const contact = document.createElement("a");
  contact.textContent = "＋ Enregistrer le contact";
  contact.href =
    "data:text/vcard;charset=utf-8," +
    encodeURIComponent(vcard);
  contact.download = "contact.vcf";
  contact.className = "primary";

  buttons.prepend(contact);

  document.getElementById("message").style.display = "none";
  document.getElementById("card").style.display = "block";
}

async function loadCard(){

  if(!slug){
    document.getElementById("message").textContent =
      "Carte introuvable. Vérifiez le lien.";
    return;
  }

  const {data,error} = await db
    .from("clients")
    .select("*")
    .eq("slug",slug)
    .eq("is_published",true)
    .maybeSingle();

  if(error){
    document.getElementById("message").textContent =
      "Erreur de chargement : " + error.message;
    return;
  }

  if(!data){
    document.getElementById("message").textContent =
      "Cette carte n'existe pas ou n'est pas publiée.";
    return;
  }

  showCard(data);
}

loadCard();
</script>

</body>
</html>
